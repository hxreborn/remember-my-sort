name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive mirror tag
        id: mirror_tag
        run: |
          code=$(grep -E '^\s+versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          name=$(grep -E '^\s+versionName\s*=' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"' | head -1)
          echo "mirror_tag=${code}-${name}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content || format('Release {0}', github.ref_name) }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag mirror release on a fresh commit
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_PAT }}
          REPO: Xposed-Modules-Repo/eu.hxreborn.remembermysort
          TAG: ${{ steps.mirror_tag.outputs.mirror_tag }}
        run: |
          sha=$(jq -n --arg tag "$TAG" '{message: $tag, tree: "4b825dc642cb6eb9a060e54bf8d69288fbee4904", parents: []}' \
            | gh api "repos/$REPO/git/commits" --input - --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha"

      - name: Mirror to Xposed-Modules-Repo
        uses: softprops/action-gh-release@v3
        with:
          repository: Xposed-Modules-Repo/eu.hxreborn.remembermysort
          token: ${{ secrets.XPOSED_REPO_PAT }}
          tag_name: ${{ steps.mirror_tag.outputs.mirror_tag }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content || format('Release {0}', github.ref_name) }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore

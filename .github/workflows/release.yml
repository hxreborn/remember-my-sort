name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive mirror tag
        id: mirror_tag
        run: |
          code=$(grep '^version\.code=' gradle.properties 2>/dev/null | cut -d= -f2)
          name=$(grep '^version\.name=' gradle.properties 2>/dev/null | cut -d= -f2)
          if [ -z "$code" ]; then
            code=$(grep -E '^\s+versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          fi
          if [ -z "$name" ]; then
            name=$(grep -E '^\s+versionName\s*=' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"' | head -1)
          fi
          echo "mirror_tag=${code}-${name}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Generate Changelog
        id: changelog
        continue-on-error: false
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          writeToFile: true
          excludeScopes: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changes || format('Release {0}', github.ref_name) }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror to Xposed-Modules-Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Xposed-Modules-Repo/eu.hxreborn.remembermysort
          token: ${{ secrets.XPOSED_REPO_PAT }}
          tag_name: ${{ steps.mirror_tag.outputs.mirror_tag }}
          body: ${{ steps.changelog.outputs.changes || format('Release {0}', github.ref_name) }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore
